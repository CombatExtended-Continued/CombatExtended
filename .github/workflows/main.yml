name: Build Branch
on:
  workflow_dispatch:
  push:
    branches: [ master, Development ]

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: prebuild
      run: |
        mkdir -p Assemblies
        mkdir -p ${{ runner.temp }}/downloads
        rm -rf AssemblyPublicizer
        git clone https://github.com/CombatExtended-Continued/AssemblyPublicizer ${{ runner.temp }}/AssemblyPublicizer

    - uses: actions/setup-dotnet@v6
      with:
        # Note: Runners may have different, newer .NET SDKs preinstalled.
        # Use global.json to control the maximum acceptable version.
        dotnet-version: '10.x'
    - name: remove loader
      run: |
        rm Assemblies/CombatExtendedLoader.dll
    - name: build publicizer
      run: |
        pushd ${{ runner.temp }}/AssemblyPublicizer
        dotnet publish
        popd
        cp ${{ runner.temp }}/AssemblyPublicizer/AssemblyPublicizer/bin/Release/net10.0/linux-x64/publish/AssemblyPublicizer AssemblyPublicizer

    - name: build core
      run: |
        sed -i "s_UNKNOWN_$(git rev-parse HEAD | head -c 10)-dev_" Source/CombatExtended/Version.cs
        TEMP=${{ runner.temp }}/ python Make.py --csproj Source/CombatExtended/CombatExtended.csproj --output Assemblies/CombatExtended.dll --download-libs --all-libs --sdk-reference /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref/ --publicizer $PWD/AssemblyPublicizer --debug -- -optimize+
        
    - name: build compat
      run: |
        TEMP=${{ runner.temp }}/ python BuildCompat.py --download-libs --all-libs --sdk-reference /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref/ --publicizer $PWD/AssemblyPublicizer --debug -- -optimize+
        
    - name: package
      run: |
        mkdir CombatExtended
        cp -r Source/ Assemblies/ About/ Defs/ Languages/ Patches/ Royalty/ Ideology/ Biotech/ Anomaly/ Odyssey/ Sounds/ Textures/ ModPatches/ LoadFolders.xml README.md SupportedThirdPartyMods.md CombatExtended
        zip -9 -r build.zip CombatExtended
    - name: Upload to DO
      run: |
        printf "%s" "$SSH_KEY" > id_ecdsa
        echo "$SSH_KEY_PUB" > id_ecdsa.pub
        chmod 600 id_ecdsa
        echo put build.zip CombatExtended-${{ github.run_id }}.zip | sftp -oStrictHostKeyChecking=no -P 2022 -i ./id_ecdsa combatextended@combatextended.lp-programming.com
        echo put build.zip CombatExtended-latest.zip | sftp -oStrictHostKeyChecking=no -P 2022 -i ./id_ecdsa combatextended@combatextended.lp-programming.com
      
      shell: bash
      env:
        SSH_KEY: ${{secrets.ID_ECDSA}}
        SSH_KEY_PUB: ${{secrets.ID_ECDSA_PUB}}

