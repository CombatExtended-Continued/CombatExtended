name: Build-PR
on:
  pull_request:
    branches: [ master, Development ]

# Restrict the permissions of the ephemeral GitHub token used by this workflow.
# This workflow executes pull request code, so it must not have write access or
# access to repository secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Prebuild
      run: |
        mkdir -p Assemblies
        mkdir -p ${{ runner.temp }}/downloads
        rm -rf AssemblyPublicizer
        git clone https://github.com/CombatExtended-Continued/AssemblyPublicizer ${{ runner.temp }}/AssemblyPublicizer
        
    - name: remove loader
      run: |
        rm Assemblies/CombatExtendedLoader.dll

    - name: build publicizer
      run: |
        pushd ${{ runner.temp }}/AssemblyPublicizer
        dotnet publish
        popd
        cp ${{ runner.temp }}/AssemblyPublicizer/AssemblyPublicizer/bin/Release/net10.0/linux-x64/publish/AssemblyPublicizer AssemblyPublicizer
        
    - name: build core
      run: |
        sed -i "s_UNKNOWN_$(git rev-parse HEAD | head -c 10)-pr${{ github.event.pull_request.number }}_" Source/CombatExtended/Version.cs
        TEMP=${{ runner.temp }}/ python Make.py --csproj Source/CombatExtended/CombatExtended.csproj --output Assemblies/CombatExtended.dll --download-libs --all-libs --sdk-reference /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref/ --publicizer $PWD/AssemblyPublicizer --debug

    - name: build compat
      run: |
        TEMP=${{ runner.temp }}/ python BuildCompat.py --download-libs --all-libs --sdk-reference /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref/ --publicizer $PWD/AssemblyPublicizer --debug
        
    - name: package
      run: |
        mkdir CombatExtended
        cp -r Source/ Assemblies/ About/ Defs/ Languages/ Patches/ Royalty/ Ideology/ Biotech/ Anomaly/ Odyssey/ Sounds/ Textures/ ModPatches/ LoadFolders.xml README.md SupportedThirdPartyMods.md CombatExtended
        zip -9 -r build.zip CombatExtended

    - name: Save PR number
      run: |
        echo ${{ github.event.number }} > ./pr-number

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: pr-build
        path: |
          build.zip
          pr-number
        if-no-files-found: error
